name: "README Score"
description: "Score your README out of 100 with fixed rules and a fix for every miss. Fails the build below a minimum score."
author: "flisk-sh"
branding:
  icon: "file-text"
  color: "green"

inputs:
  path:
    description: "Folder to score, relative to the workspace. Run actions/checkout first."
    required: false
    default: "."
  min-score:
    description: "Fail the job when the README scores below this (0-100). Empty means report only."
    required: false
    default: ""
  type:
    description: "Score as one of: cli, library, app, api. Empty detects it."
    required: false
    default: ""
  website:
    description: "Read the product's website (the homepage in package.json) and compare it with the README. Set to false to leave those checks out, e.g. before a site exists."
    required: false
    default: "true"
  version:
    description: "Empty (default) runs the scorer from this action's own checkout, so the tag you pin (@v1) is the version that runs. Set an @flisk-sh/readme-score npm version to run that instead."
    required: false
    default: ""
  node-version:
    description: "Node.js version used to run the CLI (20 or later)."
    required: false
    default: "22"

outputs:
  score:
    description: "The README's score (0-100)."
    value: ${{ steps.run.outputs.score }}
  grade:
    description: "The grade, A to F."
    value: ${{ steps.run.outputs.grade }}
  passed:
    description: "true when the score met min-score (always true without one)."
    value: ${{ steps.run.outputs.passed }}
  report:
    description: "Path to the JSON report on the runner."
    value: ${{ steps.run.outputs.report }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    # The scorer is TypeScript with no dependencies; Bun runs it from this action's checkout with no install or build.
    - if: inputs.version == ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - id: run
      shell: bash
      env:
        RS_PATH: ${{ inputs.path }}
        RS_MIN_SCORE: ${{ inputs.min-score }}
        RS_TYPE: ${{ inputs.type }}
        RS_WEBSITE: ${{ inputs.website }}
        RS_VERSION: ${{ inputs.version }}
      run: |
        set -u +e
        target="${GITHUB_WORKSPACE}/${RS_PATH}"
        # Not in the workspace: inside a checkout that holds this package, npx would look for a local link.
        cd "$RUNNER_TEMP"
        common=("$target")
        [ -n "$RS_TYPE" ] && common+=(--type "$RS_TYPE")
        [ "$RS_WEBSITE" = "false" ] && common+=(--no-website)
        if [ -n "$RS_VERSION" ]; then
          cli=(npx -y "@flisk-sh/readme-score@${RS_VERSION}")
        else
          cli=(bun "${GITHUB_ACTION_PATH}/packages/readme-score/src/bin.ts")
        fi

        # The score shows on the job summary whether or not the gate passes.
        "${cli[@]}" "${common[@]}" --markdown >> "$GITHUB_STEP_SUMMARY"

        report="${RUNNER_TEMP}/readme-score-report.json"
        gate=()
        [ -n "$RS_MIN_SCORE" ] && gate=(--min-score "$RS_MIN_SCORE")
        "${cli[@]}" "${common[@]}" ${gate[@]+"${gate[@]}"} --json > "$report"
        code=$?

        REPORT="$report" CODE="$code" node -e '
          const fs = require("fs");
          let r = {};
          try { r = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8")); } catch {}
          const out = [
            `score=${r.score ?? ""}`,
            `grade=${r.grade ?? ""}`,
            `passed=${process.env.CODE === "0"}`,
            `report=${process.env.REPORT}`,
          ];
          fs.appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          if (r.score === undefined) console.log("::error::The README could not be scored.");
          else console.log(`README: ${r.score}/100 (grade ${r.grade})`);
          if (process.env.CODE === "1")
            console.log(`::error::Below the minimum score of ${process.env.RS_MIN_SCORE}: the README scored ${r.score}.`);
        '
        exit "$code"
