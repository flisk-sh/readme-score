# Render's free plan puts the service to sleep after 15 minutes without traffic, and waking it takes about a minute.
# This asks it for /ready every 5 minutes so a visitor never waits for that. GitHub may delay a scheduled run, so it is
# a help, not a guarantee. Delete this file when the service is on a paid plan or after launch week.
name: Keep awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://readme.flisk.si/ready
